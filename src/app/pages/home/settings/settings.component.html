<app-header-wrap [noContentPadding]="true">
  <div class="tab-bar" role="tablist">
    @for (tab of tabs; track tab.id) {
      <button
        class="tab-btn"
        type="button"
        role="tab"
        [id]="'tab-' + tab.id"
        [class.active]="tab.id === activeTab()"
        [attr.aria-selected]="tab.id === activeTab()"
        [attr.aria-controls]="'panel-' + tab.id"
        (click)="activeTab.set(tab.id)">
        {{ tab.label }}
      </button>
    }
  </div>

  <div
    class="tab-content"
    role="tabpanel"
    id="panel-practice"
    aria-labelledby="tab-practice"
    [hidden]="activeTab() !== 'practice'">
    <app-practice-tab />
  </div>
  <div
    class="tab-content"
    role="tabpanel"
    id="panel-e-sign"
    aria-labelledby="tab-e-sign"
    [hidden]="activeTab() !== 'e-sign'">
    <app-e-sign-tab />
  </div>
</app-header-wrap>
