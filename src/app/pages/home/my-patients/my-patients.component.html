<app-home-header />

<app-header-wrap [noContentPadding]="true">
  <div class="top-bar">
    <div class="title">
      <img src="my-patient.png" alt="patient-icon" />
      <h3 class="m-0 ms-2">My Patients</h3>
    </div>
    <div class="actions">
      <div class="search-bar">
        <input
          type="text"
          placeholder="Search"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)" />
      </div>
      <!-- <button class="sm mobile-none">Search</button> -->
      <button class="sm outline filter-btn" (click)="showFilter.set(!showFilter())">
        <app-icon [icon]="'filter'" />
        <div class="mobile-none">Filter</div>
        @if (activeFilters().length) {
          <span>{{ activeFilters().length }}</span>
          <span
            tabindex="1"
            (keyup.esc)="clearFilters()"
            (click)="clearFilters(); $event.stopPropagation()"
            >X</span
          >
        }
      </button>
      @if (showFilter()) {
        <div class="filter-card">
          @for (filter of filters; track $index) {
            <section>
              <div class="head">
                <app-icon icon="chevron-right" />
                {{ filter.label }}
              </div>
              <div class="content">
                @for (item of filter.options; track $index) {
                  <label [for]="item.id">
                    <input
                      type="checkbox"
                      [name]="item.id"
                      [value]="item.id"
                      [checked]="selectedFilters().includes(filter.key + '>>' + item.id)"
                      (change)="onFilter(filter.key, item.id)"
                      [id]="item.id" />
                    <span>{{ item.label }}</span>
                  </label>
                }
              </div>
            </section>
          }
          <div class="actions">
            <button class="w-100" (click)="activateFilter()">Done</button>
          </div>
        </div>
      }
    </div>
  </div>
  <app-table
    [columnConfigs]="patientsColumns"
    [tableData]="searchedData()"
    [paginated]="true"
    [selection]="'single'"
    [sortingEnabled]="true"
    (emitSelection)="onSelect($event)" />
</app-header-wrap>
