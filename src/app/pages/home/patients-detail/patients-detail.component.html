<app-home-header [hasUpload]="!!selectedCaseId()" (upload)="popupOpen.set(true)" />
<section class="patient-detail-card" aria-labelledby="patient-name">
  <header class="top-bar">
    <div class="title">
      <img ngSrc="patient-detail.png" width="36" height="36" alt="" />
      <h1 id="patient-name">{{ patientData()?.PatientName }}</h1>
      <span>({{ content.patientId }}: {{ patientData()?.PatientId || patientId }})</span>
    </div>
    <div class="actions">
      <a class="page-action" routerLink="/home/my-patients"
        ><app-icon icon="chevron-left" aria-hidden="true" />{{ content.back }}</a
      >
      <button type="button" class="page-action" (click)="print()">
        <app-icon icon="print" aria-hidden="true" />{{ content.print }}
      </button>
    </div>
  </header>
  <h2 class="heading">{{ content.cases }}</h2>
  <app-table
    class="case-table"
    [columnConfigs]="caseColumns"
    [tableData]="caseRows()"
    [paginated]="true"
    selection="single"
    idKey="CaseId"
    [sortingEnabled]="true"
    [pageSize]="5"
    [preSelectedRows]="selectedRows()"
    (emitSelection)="onSelect($event)" />
  @if (patientDetailsRs.error()) {
    <div class="feedback" role="alert">
      <span>{{ content.loadError }}</span
      ><button type="button" class="outline" (click)="patientDetailsRs.reload()">
        {{ content.retry }}
      </button>
    </div>
  } @else if (selectedCaseId()) {
    <app-patients
      class="patient-case-details"
      [openPopUp]="popupOpen()"
      (closePopup)="closeUpload()"
      [data]="caseDetails()"
      [selectedCaseId]="selectedCaseId()"
      [patient]="selectedCase()"
      (alertAcknowledged)="patientDetailsRs.reload()" />
  }
</section>
