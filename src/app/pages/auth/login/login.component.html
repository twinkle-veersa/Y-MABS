<div class="login-box">
  <h2>{{ content.loginBoxTitle }}</h2>
  <form [formGroup]="group" (ngSubmit)="login()">
    <app-input [field]="content.form[0]" [group]="group" [forceShowErrors]="submitted()" />
    <app-input [field]="content.form[1]" [group]="group" [forceShowErrors]="submitted()" />

    <button type="submit" class="login-btn" [disabled]="!canSubmit()">Log In</button>
  </form>

  <div class="links">
    <p>
      Don't have an account?
      <a routerLink="/auth/register">Request Access</a>
    </p>
    <p>
      Forgot Username?
      <a routerLink="/auth/forgot-username">Reset Username</a>
    </p>
    <p>
      Forgot Password?
      <a routerLink="/auth/forgot-password">Reset Password</a>
    </p>
  </div>
</div>
