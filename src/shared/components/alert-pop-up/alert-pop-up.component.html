<div class="popup-overlay">
  <div class="popup-content">
    <div class="popup-header">
      <h2>{{ config().heading }}</h2>
      <app-icon
        icon="cross"
        class="close-btn"
        (click)="close()"
        (keydown.enter)="close()"
        (keydown.space)="close()"
        tabindex="0" />
    </div>

    <div class="popup-body">
      <div class="popup-body-alert">
        @if (config().showIcon) {
          <app-icon class="alertIcon" [icon]="config().alertIcon" />
        }
        <div
          class="popup-text"
          [class.full-width]="!config().showIcon"
          [innerHTML]="message()"></div>
      </div>
    </div>

    <div class="popup-footer">
      <button class="outline left-btn" (click)="close()">{{ config().firstButton }}</button>
      <button class="right-btn" (click)="confirmation.emit(true)">
        {{ config().secondButton }}
      </button>
    </div>
  </div>
</div>
