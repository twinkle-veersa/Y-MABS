@if (field(); as f) {
  <app-input-label [field]="f" [isRequired]="isRequired" />
  <div class="input-wrap">
    <input
      [id]="f.name"
      appFormatValue
      [formControl]="control"
      [valType]="f.inputValidation ?? null"
      [type]="
        f.inputType
          ? !(f.inputType === 'password' && showPassword())
            ? f.inputType
            : 'text'
          : 'text'
      "
      [minlength]="f.validation?.minLength || null"
      [maxlength]="f.validation?.maxLength || (f.inputValidation === 'phone' ? 14 : null)"
      [placeholder]="f.placeholder ? f.placeholder : 'Enter your ' + f.label"
      [class.invalid]="control.invalid && control.touched" />

    @if (control.value && field().validation?.custom?.length) {
      @let errors = control.errors && control.errors['weakPassword'];
      <app-password-checks [errors]="errors" />
    } @else if (control.touched && control.invalid) {
      <app-error-msg [control]="control" [label]="f.label" />
    }

    @if (f.inputType === 'password') {
      <app-icon
        [icon]="showPassword() ? 'eye-open' : 'eye-closed'"
        (click)="showPassword.set(!showPassword())" />
    }
  </div>
}
