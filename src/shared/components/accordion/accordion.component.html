<div class="accordion">
  <div
    class="accordion-header"
    (click)="isOpen.set(!isOpen())"
    tabindex="0"
    (keydown)="handleKeydown($event)">
    <div class="header-left">
      <app-icon icon="chevron-right" [class.flipped]="isOpen()" />
      <span class="header-title mobile-none">{{ title() }} {{ name() }}</span>
      <div class="mobile-title">
        <span class="header">{{ title() }}</span>
        <span class="name">{{ name() }}</span>
      </div>
    </div>
    <div class="header-right">
      <ng-content>
        <div class="search-bar">
          <app-icon icon="search" />
          <input
            type="text"
            placeholder="Search"
            [formControl]="searchControl"
            (click)="$event.stopPropagation()"
            (input)="isOpen.set(true)" />
        </div>
        <button (click)="emitSelectedData($event); $event.stopPropagation()">Done</button>
      </ng-content>
    </div>
  </div>

  <div class="accordion-content" [class.open]="isOpen()">
    <ng-content select=".table">
      <app-table
        [columnConfigs]="facilityCols"
        [tableData]="filteredOffices()"
        [selection]="'multiple'"
        [idKey]="'Id'"
        [preSelectedRows]="preSelect() || []"
        (emitSelection)="onSelection($event)" />
    </ng-content>
  </div>
</div>
