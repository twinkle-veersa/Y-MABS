<footer [class.auth-footer]="!api.isLoggedIn()">
  @if (api.isLoggedIn()) {
    <div class="content">
      <div class="links">
        @for (item of content.links; track $index) {
          <a [href]="item.href" target="_blank">{{ item.label }}</a>
          @if ($index < content.links.length - 1) {
            <span>|</span>
          }
        }
      </div>
      <br />
      <p [innerHTML]="content.text.line1"></p>
      <p [innerHTML]="content.text.line2"></p>
    </div>
    <div class="logo">
      <a [href]="content.logoHref" target="_blank">
        <img
          class="p-2"
          src="logo-ymabs-connect.svg"
          [alt]="content.logoAlt"
          width="230"
          height="38"
          decoding="async" />
      </a>
      @if (content.code) {
        <p class="mt-0 pe-4">{{ content.code }}</p>
      }
    </div>
  } @else {
    <div class="auth-content">
      <p [innerHTML]="content.text.line1"></p>
      <p>{{ content.text.line2 }}</p>
    </div>
  }
</footer>
